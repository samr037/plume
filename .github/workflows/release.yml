name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Versions
        run: |
          sw_vers
          swift --version

      - name: Tests
        run: WL_BUILD="$RUNNER_TEMP/build" scripts/test.sh

      - name: Build Plume.app
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-${GITHUB_SHA::7}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          WL_SIGN=- WL_BUILD="$RUNNER_TEMP/build" WL_APP="$PWD/dist/Plume.app" WL_VERSION="$VERSION" scripts/build-app.sh

      - name: DMG
        run: |
          scripts/make-dmg.sh dist/Plume.app "dist/Plume-$VERSION.dmg"
          shasum -a 256 "dist/Plume-$VERSION.dmg" | tee "dist/Plume-$VERSION.dmg.sha256"

      # Provenance signée (Sigstore) : gh attestation verify Plume-x.y.z.dmg -R samr037/plume
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Plume-*.dmg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Plume-${{ env.VERSION }}
          path: dist/Plume-*.dmg*

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Glissez Plume dans Applications, puis à la première ouverture : Réglages Système › Confidentialité et sécurité › Ouvrir quand même. Les modèles (environ 4 Go) se téléchargent au premier lancement.

          Vérifier que ce DMG a bien été construit par la CI de ce dépôt : \`gh attestation verify Plume-$VERSION.dmg -R samr037/plume\`
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/Plume-$VERSION.dmg dist/Plume-$VERSION.dmg.sha256 \
            --title "Plume $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
